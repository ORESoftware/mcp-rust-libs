name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.88.0', '1.97.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: packages/rust
      - name: Validate committed Rust resolution
        working-directory: packages/rust
        run: cargo metadata --locked --format-version 1 >/dev/null
      - name: Format
        working-directory: packages/rust
        run: cargo fmt --all -- --check
      - name: Minimal runtime feature boundary
        working-directory: packages/rust
        run: cargo check --locked -p ore-mcp-runtime --no-default-features
      - name: Minimal telemetry feature boundary
        working-directory: packages/rust
        run: |
          cargo check --locked -p ore-mcp-telemetry --no-default-features
          cargo test --locked -p ore-mcp-telemetry --no-default-features
      - name: Clippy
        working-directory: packages/rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Unit and adversarial tests
        working-directory: packages/rust
        run: cargo test --locked --workspace --all-targets
      - name: Telemetry stderr-only and no-ambient-input invariants
        working-directory: packages/rust
        # Salvaged from agent/den-3100-ore-mcp-telemetry, where these assertions
        # lived in a temporary branch-scoped workflow that is not being merged.
        #
        # Arming: ore-mcp-telemetry is not a workspace member on main yet; it
        # arrives with agent/den-957-mcp-runtime-remainder. Two obvious designs
        # were rejected. An unconditional check reds every unrelated pull request
        # until that branch lands. A bare `[ -d ... ] || exit 0` guard passes
        # vacuously forever the moment the crate is renamed or moved, which is the
        # failure mode that makes a check worthless. So the gate is the workspace
        # manifest -- the only file that decides whether the crate is actually
        # built -- and the check arms itself with no follow-up edit. A manifest
        # entry whose directory is missing is a hard error, never a skip.
        #
        # Do not rewrite the absent-assertions as `! grep ...`. POSIX and bash
        # both ignore `set -e` for a pipeline beginning with `!`, so that form
        # returns success whether or not the string is found. The original
        # branch-scoped workflow used it and those two assertions never ran.
        run: |
          set -euo pipefail
          crate=crates/ore-mcp-telemetry

          if ! grep -Fq '"crates/ore-mcp-telemetry",' Cargo.toml; then
            echo "::notice title=Telemetry invariants not armed::ore-mcp-telemetry is not a workspace member yet; these checks arm automatically when it is added to packages/rust/Cargo.toml. See docs/negative-knowledge.md."
            exit 0
          fi

          if [ ! -d "$crate/src" ]; then
            echo "::error title=Telemetry invariants are stale::packages/rust/Cargo.toml lists ore-mcp-telemetry as a workspace member but $crate/src does not exist. Update this step's path; do not delete the check."
            exit 1
          fi

          # Must be present. Diagnostics go to stderr, and exporter construction
          # must fail open outside a Tokio runtime: a tonic-backed OTLP exporter
          # built off-reactor panics inside the SDK, which for an MCP stdio server
          # is fatal at startup and can corrupt the JSON-RPC frame stream (DEN-3100).
          for needle in \
            '.with_writer(std::io::stderr)' \
            'Handle::try_current' \
            'catch_unwind'
          do
            if ! grep -Rq --include='*.rs' -F "$needle" "$crate/src"; then
              echo "::error title=Telemetry invariant removed::expected $needle in $crate/src"
              exit 1
            fi
          done

          # Must be absent. The crate never reads the process environment --
          # callers capture an approved snapshot and pass it explicitly -- and
          # never writes stdout, which is reserved fleet-wide for MCP protocol
          # frames. Scoped to *.rs so documenting the rule in prose cannot trip it.
          for forbidden in 'std::env::var' 'std::io::stdout'; do
            if grep -Rq --include='*.rs' -F "$forbidden" "$crate"; then
              echo "::error title=Telemetry invariant violated::$forbidden must not appear in $crate"
              grep -Rn --include='*.rs' -F "$forbidden" "$crate"
              exit 1
            fi
          done
      - name: Documentation
        working-directory: packages/rust
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps
      - name: Verify lockfile remained unchanged
        run: git diff --exit-code -- packages/rust/Cargo.lock

  audit-tool:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Compile the fleet audit and dependency-state ratchets
        run: |
          set -euo pipefail
          python -m py_compile \
            tooling/audit_rust_mcp_server.py \
            tooling/test_audit_rust_mcp_server.py \
            tooling/check_deployable_lockfile.py \
            tooling/test_check_deployable_lockfile.py \
            tooling/check_fleet_pr_evidence.py \
            tooling/test_check_fleet_pr_evidence.py \
            tooling/check_wave2_evidence.py \
            tooling/test_check_wave2_evidence.py \
            tooling/validate_api_docs_contract.py \
            tooling/test_validate_api_docs_contract.py
      - name: Run positive and adversarial audit fixtures
        run: |
          set -euo pipefail
          python -m unittest -v \
            tooling/test_audit_rust_mcp_server.py \
            tooling/test_check_deployable_lockfile.py \
            tooling/test_check_fleet_pr_evidence.py \
            tooling/test_check_wave2_evidence.py \
            tooling/test_validate_api_docs_contract.py
      - name: Validate API-docs and MCP discovery example
        run: |
          set -euo pipefail
          python tooling/validate_api_docs_contract.py \
            --manifest contracts/api-docs/example.manifest.json \
            --openapi contracts/api-docs/example.openapi.json \
            --expected-mcp-repository example/example-mcp-server.rs \
            --operations
      - name: Validate machine-readable fleet inventory and PR evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          inventory = json.loads(Path('fleet/inventory.json').read_text())
          summary = inventory['summary']
          assert len(inventory['existing']) == summary['existingStandaloneRustMcpRepositories'] == 24
          assert len(inventory['missing']) == summary['missingStandaloneRustMcpRepositories'] == 5
          assert summary['knownOrganizationsNotCurrentlyExposed'] == 0
          PY
          python tooling/check_fleet_pr_evidence.py
          python tooling/check_wave2_evidence.py
