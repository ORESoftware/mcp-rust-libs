name: Finalize DEN-1795 trusted MCP contracts

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/den-1795-apply.py
      - scripts/den-1795-fix-test.py
      - .github/workflows/den-1795-apply.yml

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.head_ref == 'agent/den-1795-trusted-mcp-contracts' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Apply exact source edits
        run: |
          set -euo pipefail
          python3 scripts/den-1795-apply.py
          python3 scripts/den-1795-fix-test.py
      - name: Validate MSRV implementation
        working-directory: packages/rust
        run: |
          set -euo pipefail
          cargo fmt --all
          git -C ../.. diff --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps
      - name: Commit the reviewable source change
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/rust/crates/ore-mcp-bootstrap/src/lib.rs
          git commit -m 'security(DEN-1795): trust executable-owned MCP flag contracts'
          git push origin "HEAD:$HEAD_BRANCH"
