name: DEN-957 one-shot bootstrap finalizer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/den-957-bootstrap-finalize.yml

permissions:
  contents: write

concurrency:
  group: den-957-bootstrap-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/den-957-bootstrap-config-telemetry'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-957-bootstrap-config-telemetry
          fetch-depth: 0
          persist-credentials: true

      - name: Install validation toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy

      - name: Format, lock, and validate current-main workspace
        working-directory: packages/rust
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          test -s Cargo.lock
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --locked --no-deps

      - name: Validate audit tooling and migration contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tooling/audit_rust_mcp_server.py \
            tooling/test_audit_rust_mcp_server.py \
            tooling/check_deployable_lockfile.py \
            tooling/test_check_deployable_lockfile.py
          python3 -m unittest -v \
            tooling/test_audit_rust_mcp_server.py \
            tooling/test_check_deployable_lockfile.py
          grep -F 'ore-mcp-bootstrap' packages/rust/Cargo.toml
          grep -F 'ore-mcp-bootstrap' packages/rust/Cargo.lock
          grep -F 'Pin every consumer to that exact merge commit' fleet/modularization-wave-1.md
          git diff --check
          if grep -R --line-number -E '^(<{7}|={7}|>{7})' \
            README.md fleet packages/rust tooling; then
            echo 'Git conflict markers are forbidden.' >&2
            exit 1
          fi

      - name: Remove helpers, commit, and push permanent review head
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/den-957-bootstrap-finalize.yml
          git rm -f --ignore-unmatch .github/workflows/materialize-bootstrap-rustfmt.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(DEN-957): finalize shared MCP bootstrap policy'
          git push origin HEAD:agent/den-957-bootstrap-config-telemetry
