name: DEN-957 run shared-crate formatter on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/den-957-pr-run-format.yml'

permissions:
  contents: write

concurrency:
  group: den-957-pr-run-format
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ORESoftware/mcp-rust-libs' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/den-957-initialize-shared-mcp-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-957-initialize-shared-mcp-hardening
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: packages/rust
      - name: Canonicalize and validate all shared Rust crates
        working-directory: packages/rust
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps
      - name: Publish canonical Rust source
        shell: bash
        run: |
          set -euo pipefail
          git add packages/rust
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'ORESoftware'
          git config user.email '11139560+ORESoftware@users.noreply.github.com'
          git commit -m 'style(DEN-957): apply canonical Rust formatting'
          git push origin HEAD:agent/den-957-initialize-shared-mcp-hardening
