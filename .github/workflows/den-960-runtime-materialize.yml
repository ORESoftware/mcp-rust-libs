name: DEN-960 runtime lock and feature proof

on:
  pull_request:
    paths:
      - .github/workflows/den-960-runtime-materialize.yml
      - packages/rust/Cargo.toml
      - packages/rust/Cargo.lock
      - packages/rust/crates/ore-mcp-runtime/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: den-960-runtime-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-prove:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.number == 22 &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/den-960-ore-mcp-runtime')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false
          submodules: false
      - name: Install canonical MSRV
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Generate the exact workspace lockfile
        run: cargo +1.88.0 generate-lockfile --manifest-path packages/rust/Cargo.toml
      - name: Verify locked metadata
        run: cargo +1.88.0 metadata --locked --manifest-path packages/rust/Cargo.toml --format-version 1 >/dev/null
      - name: Prove runtime core without default features
        run: cargo +1.88.0 test --locked --manifest-path packages/rust/Cargo.toml -p ore-mcp-runtime --no-default-features
      - name: Prove runtime with all adapters
        run: cargo +1.88.0 clippy --locked --manifest-path packages/rust/Cargo.toml -p ore-mcp-runtime --all-features --all-targets -- -D warnings
      - name: Upload generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-960-runtime-cargo-lock
          path: packages/rust/Cargo.lock
          if-no-files-found: error
          retention-days: 2
