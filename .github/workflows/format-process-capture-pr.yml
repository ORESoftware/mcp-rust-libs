# One-use workflow: format the process-capture branch, commit the source,
# remove this workflow, and let the permanent CI validate the resulting head.
name: format-process-capture-pr

on:
  push:
    branches:
      - agent/den-957-process-capture-policies-20260804
    paths:
      - '.github/workflows/format-process-capture-pr.yml'

permissions:
  contents: write

jobs:
  format-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-957-process-capture-policies-20260804
          persist-credentials: true
          fetch-depth: 1

      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.88.0'
          components: rustfmt

      - name: Format, verify, and publish reviewable source
        shell: bash
        run: |
          set -euo pipefail
          cd packages/rust
          cargo fmt --all
          cargo fmt --all -- --check
          cd ../..
          rm .github/workflows/format-process-capture-pr.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'style(process): apply canonical Rust formatting'
          git push origin HEAD:agent/den-957-process-capture-policies-20260804
