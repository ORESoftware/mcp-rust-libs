name: MCP fleet admission

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-fleet-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out reviewed MCP fleet schema
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ORESoftware/mcp-rust-libs
          ref: 562867e8be9b3e9c27b77f19aae64e001da96287
          path: .ore-mcp-runtime
          persist-credentials: false

      - name: Check out reviewed TJSV
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: 597adfaa662eb2a02d91c28c03ba5e2a46870821
          path: .ore-tjsv
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0

      - name: Install reviewed TJSV dependency graph
        working-directory: .ore-tjsv
        run: npm ci

      - name: Validate MCP fleet manifest at build admission
        run: >-
          node .ore-tjsv/bin/config-shape.mjs
          --schema .ore-mcp-runtime/contracts/mcp-fleet/fleet.schema.json
          --instance contracts/mcp-fleet.json
          --mode build

      - name: Audit declared security claims against consumer source
        # The schema above proves the manifest SAYS the right words; every
        # security property is a `const` in fleet.schema.json. This step proves
        # the words are true of the code, so a repository cannot declare
        # closed tool schemas while shipping open ones.
        run: >-
          cargo run --quiet
          --manifest-path .ore-mcp-runtime/packages/rust/Cargo.toml
          -p ore-mcp-fleet-audit -- --repo .
