# Temporary, branch-scoped reconciliation workflow. It patches the draft's
# compile-time API drift, generates the exact lock, validates the full workspace,
# and publishes only reviewable source/dependency changes. Remove before merge.
name: reconcile DEN-3081 branch

on:
  push:
    branches:
      - agent/den-3081-ore-mcp-config
    paths:
      - .github/workflows/reconcile-den-3081.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-3081-ore-mcp-config
          persist-credentials: true
          show-progress: false

      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Reconcile and validate the shared config crate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('packages/rust/crates/ore-mcp-config/src/lib.rs')
          source = source_path.read_text(encoding='utf-8')
          replacements = {
              '`ore_mcp_bootstrap::parse_log_filter`': '`ore_mcp_bootstrap::config::validate_log_filter_text`',
              'use ore_mcp_bootstrap::{is_sensitive_key, parse_log_filter};': (
                  'use ore_mcp_bootstrap::config::validate_log_filter_text;\n'
                  'use ore_mcp_safety::is_sensitive_key;'
              ),
              '.audit_config(config_path)': '.audit_config(Some(config_path))',
              'parse_log_filter(raw).map_err(|_| ConfigError::InvalidLogFilter {\n'
              '            key: sanitize_key(key),\n'
              '        })': (
                  'validate_log_filter_text(raw)\n'
                  '            .map(str::to_owned)\n'
                  '            .map_err(|_| ConfigError::InvalidLogFilter {\n'
                  '                key: sanitize_key(key),\n'
                  '            })'
              ),
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'expected source anchor missing: {old!r}')
              source = source.replace(old, new, 1)
          source_path.write_text(source, encoding='utf-8')

          manifest_path = Path('packages/rust/crates/ore-mcp-config/Cargo.toml')
          manifest = manifest_path.read_text(encoding='utf-8')
          anchor = 'ore-mcp-bootstrap = { workspace = true }\n'
          addition = anchor + 'ore-mcp-safety = { workspace = true }\n'
          if 'ore-mcp-safety = { workspace = true }' not in manifest:
              if anchor not in manifest:
                  raise SystemExit('expected manifest anchor missing')
              manifest = manifest.replace(anchor, addition, 1)
          manifest_path.write_text(manifest, encoding='utf-8')

          readme_path = Path('packages/rust/crates/ore-mcp-config/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              'keys recognized by `ore-mcp-bootstrap` as sensitive',
              'keys recognized by `ore-mcp-safety` as sensitive',
          )
          readme_path.write_text(readme, encoding='utf-8')
          PY

          cd packages/rust
          cargo check -p ore-mcp-config
          cargo fmt --all
          cargo fmt --all -- --check
          cargo metadata --locked --format-version 1 >/dev/null
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          grep -Fq 'name = "ore-mcp-config"' Cargo.lock
          grep -Fq 'git+https://github.com/ORESoftware/flags-2-env?rev=dada72e58fb976e95af43d1e35994ac33fe06f98#dada72e58fb976e95af43d1e35994ac33fe06f98' Cargo.lock
          cd ../..
          git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            packages/rust/Cargo.lock \
            packages/rust/crates/ore-mcp-config/Cargo.toml \
            packages/rust/crates/ore-mcp-config/README.md \
            packages/rust/crates/ore-mcp-config/src/lib.rs
          git commit -m 'fix(DEN-3081): align adapter with reviewed bootstrap APIs'
          git push origin HEAD:agent/den-3081-ore-mcp-config
