# Temporary, branch-scoped workflow. It generates the exact lock, validates the
# shared telemetry implementation and full workspace, publishes only reviewable
# source/dependency changes, and is removed through the repository API before PR.
name: reconcile DEN-3100 telemetry

on:
  push:
    branches:
      - agent/den-3100-ore-mcp-telemetry
    paths:
      - .github/workflows/reconcile-den-3100.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-3100-ore-mcp-telemetry
          persist-credentials: true
          show-progress: false

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Generate and validate exact telemetry dependency state
        shell: bash
        run: |
          set -euo pipefail
          cd packages/rust
          cargo generate-lockfile
          cargo check -p ore-mcp-telemetry
          cargo fmt --all
          cargo fmt --all -- --check
          cargo metadata --locked --format-version 1 >/dev/null
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          grep -Fq 'name = "ore-mcp-telemetry"' Cargo.lock
          grep -Fq 'name = "opentelemetry-otlp"' Cargo.lock
          grep -Fq '.with_writer(std::io::stderr)' crates/ore-mcp-telemetry/src/lib.rs
          ! grep -R -F 'std::env::var' crates/ore-mcp-telemetry
          ! grep -R -F 'std::io::stdout' crates/ore-mcp-telemetry
          cd ../..
          git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            README.md \
            packages/rust/Cargo.toml \
            packages/rust/Cargo.lock \
            packages/rust/crates/ore-mcp-telemetry
          git commit -m 'feat(DEN-3100): commit shared telemetry core and exact lock'
          git push origin HEAD:agent/den-3100-ore-mcp-telemetry
