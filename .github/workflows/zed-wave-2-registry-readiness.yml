name: DEN-957 wave-2 Zed registry readiness

on:
  pull_request:
    paths:
      - .github/workflows/zed-wave-2-registry-readiness.yml
      - fleet/zed-wave-2-packages.json
      - scripts/zed_wave_2_registry_readiness.py
  push:
    branches: [main]
    paths:
      - .github/workflows/zed-wave-2-registry-readiness.yml
      - fleet/zed-wave-2-packages.json
      - scripts/zed_wave_2_registry_readiness.py
  schedule:
    - cron: '41 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-wave-2-registry-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Probe 21 exact package coordinates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      all_ready: ${{ steps.probe.outputs.all_ready }}
      ready_count: ${{ steps.probe.outputs.ready_count }}
      blocked_count: ${{ steps.probe.outputs.blocked_count }}
    steps:
      - name: Check out without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Validate verifier and manifest syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zed_wave_2_registry_readiness.py
          python3 -m json.tool fleet/zed-wave-2-packages.json >/dev/null

      - name: Probe public registry publication readiness
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zed_wave_2_registry_readiness.py \
            --manifest fleet/zed-wave-2-packages.json \
            --evidence zed-wave-2-registry-readiness.json

      - name: Emit transition notice
        if: steps.probe.outputs.all_ready == 'true'
        shell: bash
        run: |
          echo '::notice title=Wave-2 Zed graph ready::All 21 package coordinates have compatible public 0.1.x releases. Run the four consumer resolver/frozen-install gates.'

      - name: Upload bounded readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zed-wave-2-registry-readiness
          path: zed-wave-2-registry-readiness.json
          if-no-files-found: warn
          retention-days: 14
