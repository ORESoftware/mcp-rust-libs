[package]
name = "ore-mcp-integrations"
description = "Read-first provider adapters and honest integration outcomes for ORESoftware MCP servers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

[features]
default = ["http-providers"]
http-providers = []
aws = ["dep:aws-sdk-eks", "dep:aws-sdk-sts"]
kubernetes = ["dep:k8s-openapi", "dep:kube"]
nats = ["dep:async-nats", "dep:tokio"]
all-providers = ["aws", "http-providers", "kubernetes", "nats"]

[dependencies]
ore-mcp-http.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"

async-nats = { version = "=0.50.0", default-features = false, features = ["ring"], optional = true }
aws-sdk-eks = { version = "=1.122.0", optional = true }
aws-sdk-sts = { version = "=1.97.0", optional = true }
k8s-openapi = { version = "=0.28.0", features = ["v1_32"], optional = true }
kube = { version = "=4.0.0", default-features = false, features = ["client", "ring", "rustls-tls"], optional = true }
tokio = { version = "1", features = ["time"], optional = true }

[lints]
workspace = true
