[package]
name = "ore-mcp-org-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Hardened read-only organization MCP server shared across the ORESoftware fleet"

[lints]
workspace = true

[dependencies]
async-nats = { version = "=0.50.0", default-features = false, features = ["ring"] }
aws-config = "=1.8.13"
aws-sdk-eks = { version = "=1.122.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "=1.97.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
kube = { version = "=4.0.0", default-features = false, features = ["client", "ring", "rustls-tls"] }
ore-mcp-bootstrap.workspace = true
ore-mcp-integrations = { workspace = true, features = ["all-providers"] }
ore-mcp-remote.workspace = true
ore-mcp-runtime.workspace = true
ore-mcp-zed-graph.workspace = true
ores-mcp-server-core-libs = { git = "https://github.com/ores-otel/ores-mcp-server-core-libs.rs", rev = "e559a76f869c2c2d9bf939b510d358a3924abd81" }
rmcp = { workspace = true, features = ["macros", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing.workspace = true
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
