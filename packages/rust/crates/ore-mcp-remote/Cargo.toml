[package]
name = "ore-mcp-remote"
description = "Shared Auth protected Streamable HTTP runtime for ORESoftware Rust MCP servers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

[dependencies]
axum = { version = "0.8.4", default-features = false, features = ["json", "tokio"] }
jsonwebtoken = { version = "9.3.1", default-features = false }
ore-mcp-http.workspace = true
ore-mcp-runtime.workspace = true
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["sync"] }
url = "2.5"

[dev-dependencies]
jsonwebtoken = { version = "9.3.1", features = ["use_pem"] }
p256 = { version = "0.13", features = ["ecdsa", "jwk", "pem", "pkcs8"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
