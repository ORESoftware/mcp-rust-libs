[package]
name = "ore-mcp-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Secret-safe stderr logging and optional OTLP lifecycle for ORESoftware MCP servers"

[lints]
workspace = true

[dependencies]
ore-mcp-bootstrap = { workspace = true }
ore-mcp-safety = { workspace = true }
opentelemetry = "0.27"
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
tokio = { version = "1.48", features = ["rt-multi-thread"] }
tracing = { workspace = true }
tracing-opentelemetry = "0.28"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"
